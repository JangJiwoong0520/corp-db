name: 법인 DB 갱신

on:
  schedule:
    # 매일 한국시간 05:43 (UTC 20:43) — CRM 자동화(07:17)보다 먼저
    - cron: "43 20 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "이번 실행 DART 호출 한도 (CRM과 하루 2만 건을 나눠 씀)"
        default: "11000"
  push:
    branches: [main]
    paths: ["index.html", "assets/**"]

env:
  PYTHONDONTWRITEBYTECODE: "1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: corp-db
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: 테스트 (가상 데이터)
        run: python3 -m unittest discover -s tests
      - name: 공시 수집
        if: github.event_name != 'push'
        run: python3 -u collector/build.py
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DART_DAILY_BUDGET: ${{ inputs.budget || '11000' }}
      - name: 수집 결과 저장
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
      - name: 디자인 파일 새로 받게 하기 (브라우저 캐시 방지)
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}-$(date +%s)/g" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: 배포 전 잠시 대기 (GitHub 쪽 파일 등록 시간)
        run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: 배포 실패 시 한 번 더 대기
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
